# Render Blueprint: FastAPI backend (api.emototamir.com)
# Kullanım: Render > New > Blueprint > bu repo. Sır değerleri (sync: false) Render panelinde girilir.
services:
  - type: web
    name: emototamir-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_CRON_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: emototamir
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://emototamir.com
      - key: CORS_ORIGINS
        value: https://emototamir.com,https://www.emototamir.com
      - key: EMERGENT_LLM_KEY
        sync: false
