# Render ücretsiz planı boşta kalan servisi uyutur; ilk istek yavaş açılır.
# Bu iş her 10 dakikada bir herkese açık vitrin ucuna istek atarak backend'i sıcak tutar.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Backend'i uyandır
        run: |
          curl --silent --show-error --output /dev/null \
            --max-time 120 --retry 2 --retry-delay 10 \
            -w "status=%{http_code} time=%{time_total}s\n" \
            https://emototamir-api.onrender.com/api/public/landing
